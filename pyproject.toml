[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "content-review"
version = "0.2.0a2"
description = "Auditable claim-graph and Anti-Delphi review of content, independent of style or authorship."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steffen Rentschler" }]
keywords = ["content-review", "claim-graph", "semantic-layer", "anti-delphi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
documents = ["openpyxl>=3.1", "pypdf>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
content-review = "budget_review.cli:main"
budget-review = "budget_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
