name: Live DeepSeek smoke test

on:
  workflow_dispatch:
    inputs:
      run_reviewers:
        description: "Also run both Anti-Delphi LLM arms"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    environment: alpha-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Live extraction and review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ inputs.run_reviewers }}" = "true" ]; then
            budget-review review src/budget_review/fixtures/coherence_theatre/proposal.md --provider deepseek --live-review --output review-output/live
          else
            budget-review review src/budget_review/fixtures/coherence_theatre/proposal.md --provider deepseek --output review-output/live
          fi
      - name: Validate live audit
        run: python scripts/validate_live_audit.py review-output/live/dossier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deepseek-dossier
          path: review-output/live/
          if-no-files-found: warn
