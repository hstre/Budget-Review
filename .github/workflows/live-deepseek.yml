name: Live DeepSeek smoke test

on:
  push:
    branches: ["alpha/v0.1.0"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Review profile to exercise"
        required: true
        default: general
        type: choice
        options:
          - general
          - budget
      run_reviewers:
        description: "Also run both Anti-Delphi LLM arms"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    environment: alpha-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Live extraction and review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.Deepseekapisecret }}
        run: |
          PROFILE="${{ inputs.profile }}"
          if [ -z "$PROFILE" ]; then
            PROFILE="budget"
          fi
          if [ "$PROFILE" = "general" ]; then
            SOURCE="docs/architecture.md"
          else
            SOURCE="src/budget_review/fixtures/coherence_theatre/proposal.md"
          fi
          REVIEW_ARGS=()
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.run_reviewers }}" = "true" ]; then
            REVIEW_ARGS+=(--live-review)
          fi
          content-review review "$SOURCE" --profile "$PROFILE" --provider deepseek "${REVIEW_ARGS[@]}" --output review-output/live
      - name: Validate live audit
        run: python scripts/validate_live_audit.py review-output/live/dossier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deepseek-dossier
          path: review-output/live/
          if-no-files-found: warn
