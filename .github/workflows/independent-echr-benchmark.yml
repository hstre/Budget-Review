name: Independent ECHR benchmark

on:
  push:
    branches:
      - independent-echr-benchmark-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: alpha-live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install current branch
        run: python -m pip install -e .
      - name: Run independent benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.Deepseekapisecret }}
        run: python scripts/independent_echr_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-echr-benchmark
          path: benchmark-output/
          if-no-files-found: warn
