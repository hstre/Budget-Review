name: Gold recall measurement

# Recall against an external gold standard, for documents far longer than the
# frozen packets cover. The corpus is cloned at run time and never vendored.
#
# The run is expected to fail on a long enough document: extraction is
# single-shot with a fixed output budget, so the JSON it must return grows with
# the source until it no longer fits. That failure is the measurement, so every
# step records its output and the artifact is uploaded either way.

on:
  workflow_dispatch:
    inputs:
      decision:
        description: "ECHR decision id from the gold corpus, e.g. 001-141170"
        required: true
        type: string
      profile:
        description: "Review profile to exercise"
        required: true
        default: general
        type: choice
        options:
          - general
          - budget

permissions:
  contents: read

jobs:
  gold-recall:
    runs-on: ubuntu-latest
    environment: alpha-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Fetch the gold corpus
        run: |
          git clone --depth 1 https://github.com/trusthlt/mining-legal-arguments.git corpus
          echo "Corpus: trusthlt/mining-legal-arguments (Apache-2.0), commit $(git -C corpus rev-parse HEAD)"

      - name: Build the case
        run: |
          mkdir -p gold-case
          python scripts/echr_gold.py corpus/gold_data "${{ inputs.decision }}" gold-case
          wc -c "gold-case/${{ inputs.decision }}.txt"

      - name: Live extraction
        id: extract
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.Deepseekapisecret }}
        run: |
          set -o pipefail
          content-review review "gold-case/${{ inputs.decision }}.txt" \
            --profile "${{ inputs.profile }}" \
            --provider deepseek \
            --output review-output/gold 2>&1 | tee gold-case/extraction.log

      - name: Measure recall
        if: steps.extract.outcome == 'success'
        run: |
          python scripts/measure_recall.py \
            review-output/gold/dossier.json \
            "gold-case/${{ inputs.decision }}.gold.json" \
            "gold-case/${{ inputs.decision }}.txt" 2>&1 | tee gold-case/recall.txt

      - name: Report an extraction that did not complete
        if: steps.extract.outcome != 'success'
        run: |
          echo "Extraction did not produce a dossier. Log:"
          cat gold-case/extraction.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-recall-${{ inputs.decision }}
          path: |
            gold-case/
            review-output/gold/
          if-no-files-found: warn
