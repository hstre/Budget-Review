name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,documents]'
      - name: Tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Frozen controls
        run: |
          content-review demo --json --output review-output/content-demo
          content-review demo --case rough --json --output review-output/rough-demo
          content-review demo --profile budget --json --output review-output/budget-demo
